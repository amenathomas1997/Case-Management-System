name: CaseManagement
options:
  bundleIdPrefix: com.cms
  deploymentTarget:
    iOS: "16.0"
targets:
  CaseManagement:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - target: CaseManagementWidget
    # The home-screen widget reads the day summary the app writes to this shared container
    # (Sources/WidgetShared.swift); the id is the app's bundle id with the "group." prefix.
    entitlements:
      path: CaseManagement.entitlements
      properties:
        com.apple.security.application-groups: [group.org.example.cms]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.cms
        MARKETING_VERSION: "3.0.35"
        CURRENT_PROJECT_VERSION: "37"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Adaptive navy / light-blue accent (Assets.xcassets/AccentColor) for system controls.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: CMS
        # How VoiceOver and Siri say the app's name (the display name is an abbreviation).
        CFBundleSpokenName: Case Management System
        # The version and build come from the build settings above, so the binary
        # always reports what MARKETING_VERSION / CURRENT_PROJECT_VERSION say.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: Face ID keeps your client records locked to you.
        NSCameraUsageDescription: The camera scans documents (releases, authorizations) straight to a client's file.
        NSMicrophoneUsageDescription: The microphone lets you run the app hands-free with the voice assistant.
        NSSpeechRecognitionUsageDescription: Speech recognition turns what you say into case-management actions, hands-free. Your speech is recognized on this iPhone when it supports that; otherwise the audio is sent to Apple to be transcribed.
        NSPhotoLibraryAddUsageDescription: Lets you save a client document image to your photo library when you choose Save Image while viewing it.
        UILaunchScreen:
          UIColorName: ""
        # Not locked to portrait (WCAG 1.3.4): a phone on a fixed landscape mount must work too.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
  # Home-screen widget: today's session count, the next start time and whether it is checked in
  # (no client names). Shares TodaySnapshot (Sources/WidgetShared.swift) with the app.
  CaseManagementWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - path: Sources/WidgetShared.swift
    entitlements:
      path: Widget/CaseManagementWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.org.example.cms]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.cms.widget
        MARKETING_VERSION: "3.0.35"
        CURRENT_PROJECT_VERSION: "37"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: CMS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
