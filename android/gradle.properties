org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The one place that names the business (as ios/project.yml does for the iPhone app). Another
# organisation building the app from the open-source code changes these values only:
#   cms.appId          its own Android application ID (the Play Store listing's ID)
#   cms.displayName    the name under the icon
#   cms.spokenName     how TalkBack says the app's name
#   cms.signinTitle    the line on the sign-in screen
#   cms.defaultServer  its server's address without https:// (for example cms.example.org or
#                      example.org/cms). Leave it empty and the sign-in screen asks for it.
# A build of your own can instead keep these keys in android/private.properties (git-ignored; its
# values win over the ones here): see "Building your own apps" in README.md.
cms.appId=org.example.cms
cms.displayName=CMS
cms.spokenName=Case Management
cms.signinTitle=Case Management
cms.defaultServer=
cms.versionName=4.32.0
cms.versionCode=17
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
