name: CaseManagement
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
# The one place that names the business (4.6.0). Another organisation building the app from the
# open-source code changes these values only:
#   CMS_BUNDLE_ID       its own app ID (the widget is <id>.widget; the shared container group.<id>)
#   CMS_TEAM            its Apple developer team
#   CMS_DISPLAY_NAME    the name under the icon; CMS_SPOKEN_NAME how VoiceOver and Siri say it
#   CMS_SIGNIN_TITLE    the line on the sign-in screen
#   CMS_DEFAULT_SERVER  its server's address without https:// (for example cms.example.org or
#                       example.org/cms). Leave it empty and the sign-in screen asks for it.
settings:
  base:
    CMS_BUNDLE_ID: org.example.cms
    CMS_TEAM: 
    CMS_DISPLAY_NAME: CMS
    CMS_SPOKEN_NAME: Case Management System
    CMS_SIGNIN_TITLE: Case Management System
    CMS_DEFAULT_SERVER: cms.example.org
# Shared schemes: CaseManagement builds the app (and its widget) only, as CI and testflight.sh use it;
# CaseManagementUITests runs the accessibility audits (UITests/), for local runs against a local test
# server only (how to run them: the notes at the top of UITests/AccessibilityAuditTests.swift).
# Nothing in the CaseManagement scheme builds or needs them.
schemes:
  CaseManagement:
    build:
      targets:
        CaseManagement: all
    run:
      config: Debug
    archive:
      config: Release
  CaseManagementWidget:
    build:
      targets:
        CaseManagementWidget: all
  CaseManagementUITests:
    build:
      targets:
        CaseManagement: [test]
        CaseManagementUITests: [test]
    test:
      config: Debug
      targets:
        - CaseManagementUITests
targets:
  CaseManagement:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - target: CaseManagementWidget
    # The home-screen widget reads the day summary the app writes to this shared container
    # (Sources/WidgetShared.swift); the id is the app's bundle id with the "group." prefix.
    entitlements:
      path: CaseManagement.entitlements
      properties:
        com.apple.security.application-groups: [group.$(CMS_BUNDLE_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CMS_BUNDLE_ID)
        MARKETING_VERSION: "4.29.0"
        CURRENT_PROJECT_VERSION: "60"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(CMS_TEAM)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Adaptive navy / light-blue accent (Assets.xcassets/AccentColor) for system controls.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: $(CMS_DISPLAY_NAME)
        # How VoiceOver and Siri say the app's name (the display name is an abbreviation).
        CFBundleSpokenName: $(CMS_SPOKEN_NAME)
        # Read by the app (Sources/API.swift, LoginView.swift): the sign-in line and the server.
        CMSSignInTitle: $(CMS_SIGNIN_TITLE)
        CMSDefaultServer: $(CMS_DEFAULT_SERVER)
        # The version and build come from the build settings above, so the binary
        # always reports what MARKETING_VERSION / CURRENT_PROJECT_VERSION say.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: Face ID keeps your client records locked to you.
        NSCameraUsageDescription: The camera scans documents (releases, authorizations) straight to a client's file.
        NSMicrophoneUsageDescription: The microphone lets you run the app hands-free with the voice assistant.
        NSSpeechRecognitionUsageDescription: Speech recognition turns what you say into case-management actions, hands-free. Your speech is recognized on this iPhone when it supports that; otherwise the audio is sent to Apple to be transcribed.
        NSPhotoLibraryAddUsageDescription: Lets you save a client document image to your photo library when you choose Save Image while viewing it.
        UILaunchScreen:
          UIColorName: ""
        # Not locked to portrait (WCAG 1.3.4): a phone on a fixed landscape mount must work too.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
  # Home-screen widget: today's session count, the next start time and whether it is checked in
  # (no client names). Shares TodaySnapshot (Sources/WidgetShared.swift) with the app.
  CaseManagementWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - path: Sources/WidgetShared.swift
    entitlements:
      path: Widget/CaseManagementWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.$(CMS_BUNDLE_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CMS_BUNDLE_ID).widget
        MARKETING_VERSION: "4.29.0"
        CURRENT_PROJECT_VERSION: "60"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(CMS_TEAM)
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: $(CMS_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # Accessibility audits of the app's screens (XCUITest performAccessibilityAudit, iOS 17+), with
  # default and the largest accessibility text size. Local runs only: they sign in to a local test
  # server with a test account given through the environment (never stored in the repository).
  CaseManagementUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: CaseManagement
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CMS_BUNDLE_ID).uitests
        TEST_TARGET_NAME: CaseManagement
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(CMS_TEAM)
