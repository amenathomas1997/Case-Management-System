; Raised so the 25 MB staff document upload (about 35 MB once base64-encoded
; inside the app's JSON body) and the 15 MB portal upload are not refused by
; PHP before the application sees them. .htaccess denies .ini files over HTTP,
; so this file is never served.
upload_max_filesize = 26M
post_max_size = 36M
memory_limit = 256M
; Defence in depth: never show errors to visitors, always log them, and keep
; argument values (which can hold client data) out of logged stack traces.
display_errors = Off
log_errors = On
zend.exception_ignore_args = On
